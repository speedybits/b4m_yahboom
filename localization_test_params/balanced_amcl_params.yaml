# Balanced AMCL Parameters for Localization Testing
# Focus: Good balance between accuracy, responsiveness, and computational efficiency
# Recommended for general indoor navigation applications

amcl:
  ros__parameters:
    use_sim_time: False
    
    # Motion model parameters - Balanced noise model
    alpha1: 0.15   # Moderate rotational error from translation
    alpha2: 0.15   # Moderate translational error from translation
    alpha3: 0.18   # Slightly higher translation error from rotation
    alpha4: 0.18   # Slightly higher rotational error from rotation
    alpha5: 0.15   # Moderate translation-related noise
    
    # Frame configuration
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Laser processing parameters - Balanced beam processing
    beam_skip_distance: 0.4
    beam_skip_error_threshold: 0.85
    beam_skip_threshold: 0.25
    do_beamskip: true
    lambda_short: 0.08
    laser_likelihood_max_dist: 1.8  # Good range for indoor environments
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 70              # Good balance of resolution and performance
    
    # Particle filter parameters - Balanced particle count
    max_particles: 2000        # Moderate particle count
    min_particles: 400         # Reasonable minimum
    pf_err: 0.04               # Moderate error tolerance
    pf_z: 0.97                 # Good confidence level
    
    # Recovery parameters - Balanced recovery
    recovery_alpha_fast: 0.08
    recovery_alpha_slow: 0.015
    
    # Update parameters - Balanced responsiveness
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.8        # Good tracking rate
    sigma_hit: 0.18            # Balanced hit distribution
    tf_broadcast: true
    transform_tolerance: 2.5   # Moderate tolerance
    update_min_a: 0.18         # Balanced angular sensitivity
    update_min_d: 0.22         # Balanced translational sensitivity
    
    # Sensor model parameters - Balanced sensor model
    z_hit: 0.6             # Good weight for accurate hits
    z_max: 0.05            # Standard max range weight
    z_rand: 0.3            # Moderate random weight
    z_short: 0.05          # Standard short reading weight
    
    scan_topic: scan