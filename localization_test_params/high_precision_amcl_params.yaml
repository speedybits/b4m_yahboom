# High Precision AMCL Parameters for Localization Testing
# Focus: Maximum localization accuracy at the cost of computational resources
# Use for applications requiring precise positioning

amcl:
  ros__parameters:
    use_sim_time: False
    
    # Motion model parameters - Very conservative noise model
    alpha1: 0.05   # Very low rotational error from translation
    alpha2: 0.05   # Very low translational error from translation
    alpha3: 0.08   # Low translation error from rotation
    alpha4: 0.08   # Low rotational error from rotation
    alpha5: 0.05   # Very low translation-related noise
    
    # Frame configuration
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Laser processing parameters - Maximum laser utilization
    beam_skip_distance: 0.2    # Minimal beam skipping
    beam_skip_error_threshold: 0.95  # Very high threshold
    beam_skip_threshold: 0.1   # Very sensitive
    do_beamskip: true
    lambda_short: 0.02         # Minimal short reading influence
    laser_likelihood_max_dist: 1.0  # Tight likelihood field
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120             # Maximum beam processing
    
    # Particle filter parameters - High particle count for precision
    max_particles: 3000        # Increased for higher precision
    min_particles: 1000        # Higher minimum for stability
    pf_err: 0.02               # Very tight error tolerance
    pf_z: 0.99                 # Very high confidence in observations
    
    # Recovery parameters - Conservative recovery
    recovery_alpha_fast: 0.05
    recovery_alpha_slow: 0.01
    
    # Update parameters - Very responsive updates
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 2.0        # High save rate for precision tracking
    sigma_hit: 0.1             # Very tight hit distribution
    tf_broadcast: true
    transform_tolerance: 1.5   # Tight transform tolerance
    update_min_a: 0.1          # Very sensitive to angular changes
    update_min_d: 0.15         # Very sensitive to translational changes
    
    # Sensor model parameters - Maximum weight on accurate measurements
    z_hit: 0.8             # Very high weight for accurate hits
    z_max: 0.03            # Minimal max range weight
    z_rand: 0.15           # Minimal random weight
    z_short: 0.02          # Minimal short reading weight
    
    scan_topic: scan