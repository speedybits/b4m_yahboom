# Baseline AMCL Parameters for Localization Testing
# Based on current robot1_amcl_params.yaml configuration
# These are the current production settings used as reference

amcl:
  ros__parameters:
    use_sim_time: False
    
    # Motion model parameters - current baseline
    alpha1: 0.2    # Expected error in rotation as a function of translation
    alpha2: 0.2    # Expected error in translation as a function of translation  
    alpha3: 0.2    # Expected error in translation as a function of rotation
    alpha4: 0.2    # Expected error in rotation as a function of rotation
    alpha5: 0.2    # Translation-related noise
    
    # Frame configuration
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Laser processing parameters
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    
    # Particle filter parameters
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05           # Maximum error between true and estimated position
    pf_z: 0.99             # Probability of observing unexpected obstacle
    
    # Recovery parameters
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    
    # Update parameters
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 3.0
    update_min_a: 0.2      # Minimum angular change to trigger update (radians)
    update_min_d: 0.25     # Minimum translational change to trigger update (meters)
    
    # Sensor model parameters
    z_hit: 0.5             # Weight for accurate laser hits
    z_max: 0.05            # Weight for max range readings
    z_rand: 0.5            # Weight for random readings
    z_short: 0.05          # Weight for short readings
    
    scan_topic: scan