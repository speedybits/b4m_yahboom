# Conservative localization parameter set
# Reduces particle count and makes motion model more conservative

description: "Conservative tuning - fewer particles, conservative motion model"
parameters:
  amcl:
    min_particles: 100
    max_particles: 1000
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    pf_err: 0.005
    update_min_d: 0.1
    update_min_a: 0.1
  
  navigation:
    controller_frequency: 10.0
    xy_goal_tolerance: 0.5
    yaw_goal_tolerance: 0.5
    
  ekf:
    frequency: 20.0