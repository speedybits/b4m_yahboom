# Aggressive localization parameter set
# Increases particle count and makes motion model more responsive

description: "Aggressive tuning - more particles, responsive motion model"
parameters:
  amcl:
    min_particles: 1000
    max_particles: 5000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    pf_err: 0.02
    update_min_d: 0.025
    update_min_a: 0.025
  
  navigation:
    controller_frequency: 25.0
    xy_goal_tolerance: 0.15
    yaw_goal_tolerance: 0.15
    
  ekf:
    frequency: 40.0