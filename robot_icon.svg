<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot body -->
  <rect x="20" y="25" width="24" height="30" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Robot head -->
  <circle cx="32" cy="18" r="10" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="28" cy="16" r="2" fill="white"/>
  <circle cx="36" cy="16" r="2" fill="white"/>
  <circle cx="28" cy="16" r="1" fill="black"/>
  <circle cx="36" cy="16" r="1" fill="black"/>
  
  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#FF9800" stroke-width="2"/>
  <circle cx="32" cy="8" r="2" fill="#FF9800"/>
  
  <!-- Arms -->
  <rect x="12" y="28" width="6" height="15" rx="3" fill="#607D8B" stroke="#455A64" stroke-width="1"/>
  <rect x="46" y="28" width="6" height="15" rx="3" fill="#607D8B" stroke="#455A64" stroke-width="1"/>
  
  <!-- Control panel -->
  <rect x="25" y="32" width="14" height="8" rx="1" fill="#263238" stroke="#37474F" stroke-width="1"/>
  <circle cx="28" cy="36" r="1" fill="#4CAF50"/>
  <circle cx="32" cy="36" r="1" fill="#F44336"/>
  <circle cx="36" cy="36" r="1" fill="#2196F3"/>
  
  <!-- B4M Text -->
  <text x="32" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">B4M</text>
</svg>