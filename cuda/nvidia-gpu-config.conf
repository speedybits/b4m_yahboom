# NVIDIA GPU Configuration for HP Victus
# Reserve NVIDIA RTX 4070 for CUDA workloads only
# Desktop environment will use AMD integrated graphics

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "AMD Graphics"
    Driver "amdgpu"
    BusID "PCI:5:0:0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "AMD Graphics"
EndSection
