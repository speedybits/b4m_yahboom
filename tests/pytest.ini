[tool:pytest]
# Pytest configuration for HA_converse tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=ha_converse
    --cov-report=html:tests/htmlcov
    --cov-report=term-missing
    --cov-fail-under=85

# Markers
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interaction
    stress: Stress tests - resource intensive tests
    slow: Slow tests - may take more than 1 second
    network: Tests requiring network access
    audio: Tests involving audio processing
    b4m: Tests involving B4M API integration
    piper: Tests involving Piper TTS integration

# Test timeouts
timeout = 30
timeout_method = thread

# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sounddevice
    ignore::UserWarning:numpy

# Minimum version requirements
minversion = 6.0

# Test collection options
collect_ignore = [
    "setup.py",
    "build",
    "dist"
]

# Coverage options
[coverage:run]
source = ha_converse
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod