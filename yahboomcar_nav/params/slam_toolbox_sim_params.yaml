slam_toolbox:
  ros__parameters:
    # Basic Configuration (adjusted for Gazebo URDF frames)
    odom_frame: odom
    map_frame: map
    base_frame: robot2/base_link
    scan_topic: /scan
    use_map_saver: true
    use_lifecycle_manager: false
    use_sim_time: true  # Key difference for simulation

    # SLAM Parameters
    mode: mapping  # Options: mapping, localization, lifelong
    
    # Simulation-specific tuning
    minimum_time_interval: 0.1  # Faster for simulation
    minimum_travel_distance: 0.2  # Smaller increments
    minimum_travel_heading: 0.2
    
    # More aggressive loop closure for simulation
    loop_search_maximum_distance: 5.0
    loop_match_minimum_response_coarse: 0.25
    loop_match_minimum_response_fine: 0.35
    
    # Scan Processing (optimized for simulation)
    max_laser_range: 20.0
    transform_timeout: 0.2      # Lower timeout for simulation
    tf_buffer_duration: 30.0
    
    # Performance Tuning for Gazebo
    stack_size_to_use: 40000000
    scan_buffer_size: 10          # Larger buffer for simulation
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    
    # Map Resolution and Quality
    resolution: 0.05
    map_file_name: yahboom_slam_sim_map
    map_start_at_dock: true
    
    # Solver Parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

# Map Saver Parameters
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true